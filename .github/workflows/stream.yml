name: AhadZ9 Live Quiz Stream

on:
  workflow_dispatch:

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Strict 6 hours cloud execution limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir pillow pytchat requests

      - name: Start Live Quiz Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
        run: |
          python main.py
          
